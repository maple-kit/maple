packages:
  - "packages/*"
  - "examples/*"
  - "evals"
  - "tools/*"

# Refuse versions published less than three days ago. A compromised release is
# usually caught and unpublished within hours; waiting costs nothing.
minimumReleaseAge: 4320

# A scoped exception to minimumReleaseAge, not a relaxation of it. Effect v4 and
# its TypeSafe provider were pinned at the newest stable release the day it
# shipped, as the owner asked, so the three-day wait is waived for these two
# names only. Everything else still waits. Remove this once the next Effect
# bump can wait its three days.
minimumReleaseAgeExclude:
  - "effect"
  - "@effect/ai-typesafe"

# .npmrc sets ignore-scripts=true. Packages that genuinely need a build step at
# install time are allowed back one at a time, with a reason. Nothing does: the
# eval harness is plain vitest, so better-sqlite3 left with evalite and took the
# four @fastify/static advisories its result viewer carried with it.
onlyBuiltDependencies: []
