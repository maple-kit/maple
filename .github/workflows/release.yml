name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Opening and updating the "Version Packages" pull request.
      contents: write
      pull-requests: write
      # The OIDC token npm exchanges for a provenance attestation. Without it
      # `provenance=true` in .npmrc fails the publish rather than skipping.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Point npm at the public registry
        # Still needed without a token: OIDC has to know which registry it is
        # exchanging for. The credential is gone; the registry name is not.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Version, or publish what was versioned
        # `version` writes the bumps and opens a pull request. Merging that
        # pull request runs this job again, finds no changesets, and `publish`
        # is what runs instead.
        #
        # `pnpm build` is explicit because ignore-scripts=true means a prepack
        # would never fire: nothing else rebuilds dist before it is packed.
        #
        # docs:sync-versions moves every version pin in the docs, the plugin's
        # MCP pin and the plugin version in the same pull request, so the
        # stale-version guard in CI never fails on the release that follows.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # The action runs this without a shell, so `&&` would reach
          # `changeset` as an argument; the chain lives in package.json.
          version: pnpm version-packages
          publish: pnpm release
          title: "chore: version packages"
          # A block scalar, so the trailer survives into the commit message.
          # The `dco` check walks every commit on the version pull request and
          # changesets/action would otherwise commit with no sign-off at all.
          commit: |
            chore: version packages

            Signed-off-by: N1TZANKL <63898112+N1TZANKL@users.noreply.github.com>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Push the tags changeset publish just wrote
        # changesets/action only pushes tags for packages it recognised in the
        # publish output, and it looks for a "New tag:" line that
        # @changesets/cli 3 no longer prints — it draws a spinner instead. So
        # the action sees nothing published and 0.1.0 shipped untagged.
        #
        # `changeset publish` does create the tags locally, in this checkout.
        # Pushing them here is what makes them exist. A run that published
        # nothing has no new tags and this is a no-op.
        id: tags
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(jq -r .version packages/mcp/package.json)
          tag="@maple-kit/mcp@${version}"
          # The tag is on origin only once a release has pushed it, so one
          # missing there that exists locally is a publish from this run.
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null \
            && ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "mcp_published=true" >> "$GITHUB_OUTPUT"
          fi
          # --porcelain marks each tag it creates on origin "[new tag]".
          pushed=$(git push --porcelain origin --tags)
          if grep -q '\[new tag\]' <<<"$pushed"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Releases for the new tags
        # After the tag push, so a failure here costs neither the publish nor
        # the tags. Releases are skipped when they already exist, and the
        # notes are each version's section of its package's CHANGELOG.md.
        if: steps.tags.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node tools/github-releases/release.ts

      - name: Install mcp-publisher
        if: steps.tags.outputs.mcp_published == 'true'
        env:
          MCP_PUBLISHER_VERSION: 1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -sSLf -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher

      - name: Publish @maple-kit/mcp to the MCP Registry
        # After the tag push, so a registry failure fails the run visibly
        # without costing the tags. server.json takes its versions from
        # package.json here, so the committed file cannot drift from npm.
        if: steps.tags.outputs.mcp_published == 'true'
        working-directory: packages/mcp
        run: |
          version=$(jq -r .version package.json)
          jq --arg v "$version" '.version = $v | .packages[0].version = $v' server.json > server.json.new
          mv server.json.new server.json
          ../../mcp-publisher login github-oidc
          ../../mcp-publisher publish
