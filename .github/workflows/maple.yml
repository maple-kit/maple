name: Maple

# Dogfoods the merge gate: reports maple/visual-review on every pull request.
# Advisory: the check is not required by any ruleset. A resolve in the overlay
# edits the ledger comment in place, so `edited` re-runs sync and gate then.
# issue_comment runs this file from the default branch, never the PR's copy,
# and the action checks nothing out, so a comment cannot run PR code.
on:
  pull_request:
  issue_comment:
    types: [edited]

permissions:
  contents: read

jobs:
  review:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request &&
      contains(github.event.comment.body, '<!-- maple:visual-review -->'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: maple-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: maple-kit/maple-action@173453ac0fab43983dad576c230eff529a6ca498 # v0.5.0
        with:
          mode: sync
      - uses: maple-kit/maple-action@173453ac0fab43983dad576c230eff529a6ca498 # v0.5.0
        with:
          mode: gate
