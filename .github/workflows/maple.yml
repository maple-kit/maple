name: Maple

# Dogfoods the merge gate: reports maple/visual-review on every pull request.
# Advisory: the check is not required by any ruleset. The overlay posts, edits
# and deletes ```maple comments as the reviewer, so those events re-run sync
# and gate; the action's own GITHUB_TOKEN edits trigger nothing. issue_comment
# runs the default branch's copy and checks nothing out, so no PR code runs.
on:
  pull_request:
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read

jobs:
  review:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request &&
      contains(github.event.comment.body, '```maple'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: maple-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: maple-kit/maple-action@173453ac0fab43983dad576c230eff529a6ca498 # v0.5.0
        with:
          mode: sync
      - uses: maple-kit/maple-action@173453ac0fab43983dad576c230eff529a6ca498 # v0.5.0
        with:
          mode: gate
