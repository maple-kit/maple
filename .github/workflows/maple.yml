name: Maple

# Dogfoods the merge gate: reports maple/visual-review on every pull request.
# Advisory: the check is not required by any ruleset. maple-action v0.4.0 reads
# the pull request and head SHA only from a pull_request payload, so it cannot
# re-run on issue_comment (the ledger comment edited on a resolve). Until it can,
# the preview route's publish (docs/gate.md, "Publishing from the route") is the
# only way the check clears without a push. Runs the published action.
on:
  pull_request:

concurrency:
  group: maple-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: maple-kit/maple-action@305f1b796eeda5629e1cea72c8204f824ad76fa4 # v0.4.0
        with:
          mode: sync
      - uses: maple-kit/maple-action@305f1b796eeda5629e1cea72c8204f824ad76fa4 # v0.4.0
        with:
          mode: gate
