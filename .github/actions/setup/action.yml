name: Set up the toolchain
description: Install Node and pnpm, restore the store, and install with a frozen lockfile.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    # Socket Firewall refuses a package Socket has confirmed as malware, at the
    # moment it is fetched. It needs no token. Pinned to a SHA: it is a control.
    - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
      with:
        mode: firewall-free
        firewall-version: 1.15.4

    - name: Install
      shell: bash
      # --frozen-lockfile fails rather than resolving: a lockfile that does not
      # match package.json is a review problem, not something CI should fix.
      run: sfw pnpm install --frozen-lockfile

    - name: Build the allowlisted native dependency
      shell: bash
      # ignore-scripts=true overrides onlyBuiltDependencies, so the binding has
      # to be built explicitly. See evals/README.md.
      run: pnpm rebuild better-sqlite3
